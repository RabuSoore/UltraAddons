name: Build PlayerPoints Addon

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build PlayerPoints
      run: ./gradlew :PlayerPoints:build --no-daemon

    - name: Upload PlayerPoints JAR
      uses: actions/upload-artifact@v4
      with:
        name: PlayerPoints-Addon
        path: "PlayerPoints/build/libs/*.jar"
