name: Build UltraCustomizer Addons

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Organize Artifacts
        run: |
          mkdir -p output_jars
          find . -maxdepth 3 -type f -path "*/build/libs/*.jar" ! -name "*-plain.jar" -exec cp {} output_jars/ \;

      - name: Upload Compiled JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraCustomizer-Addons-JDK21
          path: output_jars/*.jar
          retention-days: 7
          
